name: embege

services:
  api:
    build:
      context: .
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:?Isi APP_ENV di .env}
      LOG_LEVEL: ${LOG_LEVEL:?Isi LOG_LEVEL di .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Isi DB_NAME di .env}
      DB_USER: ${DB_USER:?Isi DB_USER di .env}
      DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      REDIS_URL: ${REDIS_URL:?Isi REDIS_URL di .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Isi JWT_SECRET_KEY minimal 32 byte di .env}
      LLM_API_KEY: ${LLM_API_KEY:?Isi LLM_API_KEY di .env}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - ${API_PORT:?Isi API_PORT di .env}
      - --workers
      - ${UVICORN_WORKERS:?Isi UVICORN_WORKERS di .env}
      - --proxy-headers
      - --forwarded-allow-ips
      - ${FORWARDED_ALLOW_IPS:?Isi FORWARDED_ALLOW_IPS di .env}
      - --timeout-graceful-shutdown
      - "20"
    ports:
      - "127.0.0.1:${API_PORT:?Isi API_PORT di .env}:${API_PORT:?Isi API_PORT di .env}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${API_PORT:?Isi API_PORT di .env}/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Isi DB_NAME di .env}
      POSTGRES_USER: ${DB_USER:?Isi DB_USER di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
