x-api-base: &api-base
  image: python:3.11-slim
  working_dir: /app
  volumes:
    - .:/app
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  database-init:
    <<: *api-base
    command: >-
      sh -c "pip install --no-cache-dir --editable . &&
      exec python -m app.databases.script"
    volumes:
      - .:/app
      - type: bind
        source: ./app/databases/data
        target: /app/app/databases/data
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-base
    command: >-
      sh -c "pip install --no-cache-dir --editable . &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      database-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
